name: Keruu

on:
  schedule:
    - cron: "17 */3 * * *"   # 3 h välein, minuutilla 17 (tasatunnit ovat GitHubissa ruuhkaisia)
  workflow_dispatch:          # käsin käynnistys Actions-välilehdeltä

permissions:
  contents: write             # vain heartbeat-committia varten

concurrency:
  group: keruu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kameroiden metatietojen välimuisti
        uses: actions/cache@v4
        with:
          path: cache
          key: cameras-${{ github.run_id }}
          restore-keys: cameras-

      - name: Kerää ja lataa Hugging Faceen
        run: python collector/collect.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}

      # Julkisessa repossa GitHub poistaa ajastuksen käytöstä, jos repossa ei ole
      # tapahtunut mitään 60 päivään. Viikoittainen pieni commit pitää sen elossa.
      - name: Heartbeat (maanantain klo 00 UTC ajo)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u%H)" = "100" ]; then
            mkdir -p status
            date -u +%FT%TZ > status/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/heartbeat.txt
            git commit -m "Heartbeat $(date -u +%F)"
            git push
          fi
