name: Keruu

on:
  schedule:
    # Joka tunti: sivu päivittyy, ja keräin hakee Digitrafficin ~23 h historiasta kaikki puuttuvat
    # keruuhetket (joka 3. tasatunti + talvitihennys). GitHub pudottaa ajastettuja ajoja, mutta data
    # ei katoa, kunhan yksi ajo menee läpi vuorokaudessa.
    - cron: "17 * * * *"      # minuutilla 17 (tasatunnit ovat GitHubissa ruuhkaisia)
  workflow_dispatch:          # käsin käynnistys Actions-välilehdeltä

permissions:
  contents: write             # heartbeat-commit
  pages: write                # sivun julkaisu
  id-token: write             # Pages-julkaisun tunnistautuminen

concurrency:
  group: keruu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40         # ensimmäinen ajo voi hakea ~23 h kerralla
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kameroiden metatietojen välimuisti
        uses: actions/cache@v4
        with:
          path: cache
          key: cameras-${{ github.run_id }}
          restore-keys: cameras-

      - name: Hae puuttuvat keruuhetket ja lataa Hugging Faceen
        id: collect
        run: python collector/collect.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}

      # Sivun data suoraan Digitrafficista (nykytila + 24 h historia) + Ilmatieteen laitoksen varoitukset.
      # Jos tämä epäonnistuu, keruu on jo tallessa; sivu jää edelliseen versioon.
      - name: Rakenna karttasivun data
        id: site
        continue-on-error: true
        run: python collector/build_site.py

      - name: Valmistele Pages-julkaisu
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Julkisessa repossa GitHub poistaa ajastuksen käytöstä, jos repossa ei ole tapahtunut mitään
      # 60 päivään. Heartbeat-commit tehdään, kun edellisestä on yli 6 päivää (ei sidottu tiettyyn
      # tuntiin, koska GitHub pudottaa suurimman osan ajastetuista ajoista).
      - name: Heartbeat (jos edellisestä yli 6 päivää)
        run: |
          last=$(cat status/heartbeat.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -gt 518400 ]; then
            mkdir -p status
            date -u +%FT%TZ > status/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/heartbeat.txt
            git commit -m "Heartbeat $(date -u +%F)"
            git pull --rebase --autostash -q && git push
          fi
    outputs:
      site: ${{ steps.site.outcome }}

  deploy:
    needs: collect
    if: needs.collect.outputs.site == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v4

  # Keruuaukkojen valvonta: jos ruudukkohetki on pudonnut historian ulkopuolelle ilman tiedostoa,
  # se on menetetty. Ajo merkitään epäonnistuneeksi, jolloin GitHub lähettää siitä ilmoituksen.
  # Erillinen työ, jotta sivun päivitys ja julkaisu eivät jää tämän takia tekemättä.
  gaps:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarkista menetetyt keruuhetket
        run: python collector/collect.py --check-gaps
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
