name: Keruu

on:
  schedule:
    # Joka tunti: sivu päivittyy tunnin välein, ja kuvat kerätään, kun edellisestä keruusta on yli 2,5 h.
    # GitHub pudottaa ajastettuja ajoja ruuhkassa, joten tiheämpi ajastus paikkaa aukot.
    - cron: "17 * * * *"      # minuutilla 17 (tasatunnit ovat GitHubissa ruuhkaisia)
  workflow_dispatch:          # käsin käynnistys Actions-välilehdeltä

permissions:
  contents: write             # heartbeat-commit
  pages: write                # sivun julkaisu
  id-token: write             # Pages-julkaisun tunnistautuminen

concurrency:
  group: keruu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kameroiden metatietojen välimuisti
        uses: actions/cache@v4
        with:
          path: cache
          key: cameras-${{ github.run_id }}
          restore-keys: cameras-

      - name: Kerää ja lataa Hugging Faceen (jos on aika)
        id: collect
        run: python collector/collect.py --if-due 2.5
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}

      # Sivun data suoraan Digitrafficista (nykytila + 24 h historia) + Ilmatieteen laitoksen varoitukset.
      # Jos tämä epäonnistuu, keruu on jo tallessa; sivu jää edelliseen versioon.
      - name: Rakenna karttasivun data
        id: site
        continue-on-error: true
        run: python collector/build_site.py

      - name: Valmistele Pages-julkaisu
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Julkisessa repossa GitHub poistaa ajastuksen käytöstä, jos repossa ei ole
      # tapahtunut mitään 60 päivään. Viikoittainen pieni commit pitää sen elossa.
      - name: Heartbeat (maanantain klo 00 UTC ajo)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u%H)" = "100" ]; then
            mkdir -p status
            date -u +%FT%TZ > status/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/heartbeat.txt
            git commit -m "Heartbeat $(date -u +%F)"
            git push
          fi
    outputs:
      site: ${{ steps.site.outcome }}

  deploy:
    needs: collect
    if: needs.collect.outputs.site == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v4
