<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>Kelikamera · Suomen tiet nyt</title>
<meta name="description" content="Tien pinnan tila Fintrafficin kelikameroissa: mitattu tiesääasemilta, tekoälyarvio tulossa.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' style='background:%230b0d10' width='22' height='22' viewBox='0 0 24 24' aria-hidden='true'><defs><clipPath id='lens'><circle cx='12' cy='13' r='5.2'/></clipPath></defs><path d='M8.2 6 9.6 3.6h4.8L15.8 6' fill='none' stroke='%23eef1f4' stroke-width='1.7' stroke-linejoin='round'/><rect x='1.8' y='6' width='20.4' height='14.6' rx='3' fill='none' stroke='%23eef1f4' stroke-width='1.7'/><circle cx='12' cy='13' r='5.2' fill='none' stroke='%23eef1f4' stroke-width='1.7'/><g clip-path='url(%23lens)' stroke-linecap='round'><path d='M9.3 18.5 11.3 8.2M14.7 18.5 12.7 8.2' stroke='%23eef1f4' stroke-width='1.2'/><path d='M12 17.6v-1.8M12 14.3v-1.5M12 11.4v-1.2' stroke='%23f5c518' stroke-width='1.2'/></g><circle cx='18.6' cy='9' r='1' fill='%23ff4766'/></svg>">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ei estä ensimmäistä piirtoa: kartan tyylit ja fontti ladataan rinnalla -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --bg:#0b0d10; --surface:#171b21; --surface-2:#1f242c; --rule:#2e353f;
  --text:#eef1f4; --text-2:#a3acb8; --focus:#ffd23f; --warn:#f5c518;
  --kuiva:#34c77b; --kostea:#8fc7ff; --marka:#2f7bf6; --luminen:#f2f4f8; --jaa:#ff4766; --none:#7d8794;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
button,[role="tab"],a{touch-action:manipulation}
button,[role="tab"]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tabpanel,.panel .scroll,.sugg{overscroll-behavior:contain}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Fira Sans",system-ui,sans-serif}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#map{position:fixed;inset:0}
.num{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:1px;flex:none}

/* ---------- vasen kortti ---------- */
.key{position:fixed;left:16px;top:16px;z-index:5;width:356px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.key header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{flex:none;color:var(--text)}
.key h1{font-size:16px;font-weight:600;letter-spacing:-.005em}
.key time{white-space:nowrap;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;margin-left:8px}
.lang{display:flex;border:1px solid var(--rule);border-radius:2px}
.lang button{padding:4px 8px;font-size:12px;color:var(--text-2);min-width:34px}
.lang button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1 1 auto;white-space:nowrap;padding:11px 10px 10px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.tabs .badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:2px;background:var(--jaa);color:#111;font-size:12px;font-weight:600}
.tabpanel{overflow:auto}
.key.loading #warnsec,.key.loading .credits{visibility:hidden}
@media (min-width:721px){#rows:empty{min-height:372px}}
.fold{display:none;width:40px;height:32px;place-items:center;border-radius:2px;color:var(--text-2)}
.fold svg{transition:transform .2s}
.key.collapsed .fold svg{transform:rotate(-90deg)}
.tabpanel[hidden]{display:none}
.rows{list-style:none;padding:8px 0}
.row{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;padding:9px 16px 12px;text-align:left;position:relative}
.row .lbl{font-size:14px}
.row .n{font-size:13px;color:var(--text-2)}
.row .share{position:absolute;left:38px;right:16px;bottom:5px;height:2px;background:var(--rule)}
.row .share i{display:block;height:100%;background:currentColor;opacity:.55}
.row[aria-pressed="false"] .lbl,.row[aria-pressed="false"] .n{opacity:.4;text-decoration:line-through}
.row[aria-pressed="false"] .sw{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--text-2)}
.sec{border-top:1px solid var(--rule);padding:18px 16px 16px}
.sec h2{font-size:14px;font-weight:600;color:var(--text);display:flex;justify-content:space-between}
.sec h2 .num{font-weight:500;color:var(--text-2)}
.sec .sub{margin:2px 0 10px}
.note{font-size:12px;color:var(--text-2)}
.warn{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--rule)}
.warn:first-of-type{border-top:0}
.warn b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.warn b i{width:10px;height:10px;border:2px solid var(--warn);background:rgba(245,197,24,.25);flex:none}
.warn span{display:block;font-size:12px;color:var(--text-2);margin:2px 0 0 18px}
.warn .hz{display:block;font-size:12px;color:var(--text-2);margin:2px 0 0 18px}
.warn b::after{content:attr(data-st);flex:none;margin-left:auto;font-size:12px;font-weight:500;color:var(--text-2);border:1px solid var(--rule);padding:0 5px;border-radius:2px}
.warn.now b::after{content:attr(data-st);font-size:12px;font-weight:600;color:#111;background:var(--warn);padding:0 5px;border-radius:2px}
.warnsum{display:none;width:100%;align-items:center;gap:10px;padding:10px 0 2px;text-align:left;min-height:40px}
.warnsum i{width:10px;height:10px;border:2px solid var(--warn);background:rgba(245,197,24,.25);flex:none}
.warnsum b{font-size:14px;font-weight:600}
.warnsum .num{margin-left:auto;color:var(--text-2)}
.warnsum svg{color:var(--text-2)}
.wlist{padding:4px 14px 14px 20px}
.list{list-style:none}
.item{width:100%;display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 16px;text-align:left;border-bottom:1px solid var(--rule)}
.item b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:500}
.item small{display:block;font-size:12px;color:var(--text-2)}
.item .ago{font-size:12px;color:var(--text-2);white-space:nowrap}
.blank{padding:16px;font-size:13px;color:var(--text-2)}
.roadsel{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.roadsel label{font-size:13px;color:var(--text-2)}
.roadsel select{flex:1;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--surface-2)}
.roadstrip{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.roadstrip .bars{display:flex;gap:1px;height:16px}
.roadstrip .bars i{flex:1}
.roadstrip .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:4px}

/* ---------- reitti ---------- */
.rform{padding:14px 16px 6px;display:grid;gap:10px}
.field{position:relative}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.field .in{display:flex;gap:6px}
.field input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px}
.field input:focus-visible{outline:2px solid var(--focus);outline-offset:0}
.iconbtn{flex:none;width:38px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:2px;color:var(--text-2)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:3;list-style:none;background:var(--surface-2);border:1px solid var(--rule);border-top:0;max-height:220px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:14px}
.sugg button small{display:block;font-size:12px;color:var(--text-2)}
.sugg button[aria-selected="true"]{background:var(--rule)}
.rbtns{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2);min-height:24px}
.rbtns button{color:var(--text-2);text-decoration:underline}
.rsum{padding:12px 16px 14px;border-top:1px solid var(--rule)}
.rsum .trip{font-size:15px;font-weight:600}
.rsum .meta{font-size:13px;color:var(--text-2);margin-top:2px}
.rsum .mix{display:flex;height:8px;margin:12px 0 6px;border-radius:1px;overflow:hidden;background:var(--rule)}
.rsum .mix i{display:block}
.rsum ul{list-style:none;margin-top:10px;display:grid;gap:8px;font-size:14px}
.rsum li{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start}
.rsum li .dot{width:10px;height:10px;margin-top:5px;border-radius:1px}
.rsum li.alert .dot{background:var(--c,var(--jaa))}
.rsum li.ok .dot{background:var(--c,var(--kuiva))}
.rsum li.warnl .dot{background:transparent;border:2px solid var(--warn)}
.rsum li.gray .dot{background:var(--none)}
.rsum .disc{font-size:12px;color:var(--text-2);margin-top:12px}
.rstrip{padding:12px 16px 10px;border-top:1px solid var(--rule)}
.rstrip .bars{position:relative;height:16px;background:var(--surface-2)}
.rstrip .bars i{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px}
.rstrip .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums}
.lnk{display:inline;text-decoration:underline;color:var(--text);margin-left:2px}
.item .km{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- aikajana ---------- */
.timeline{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;width:min(560px,calc(100% - 32px));
  display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:6px 14px 6px 8px;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.timeline .play{width:40px;height:40px;display:grid;place-items:center;border-radius:2px}
.tl{position:relative;height:50px}
.tbars{position:absolute;left:0;right:0;top:4px;height:28px;display:flex;gap:2px;align-items:stretch}
.tbars .col{flex:1;display:flex;flex-direction:column-reverse;border-radius:1px;overflow:hidden;opacity:.4;transition:opacity .15s}
.tbars .col.sel{opacity:1;box-shadow:0 0 0 1.5px var(--text)}
.tbars .col.past{opacity:.55}
.tbars .col i{display:block}
.tbars .tempty{margin:auto;font-size:12px;color:var(--text-2)}
.noimg{aspect-ratio:16/9;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);font-size:13px;border-radius:2px}
.tl input{position:absolute;left:0;right:0;top:0;height:36px;width:100%;margin:0;opacity:0;cursor:pointer}
.tl:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.tticks{position:absolute;left:0;right:0;bottom:0;height:14px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.tticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.timeline output{font-size:13px;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.timeline output.past{color:var(--warn)}

/* ---------- tietopaneeli ---------- */
.panel{position:fixed;right:16px;top:16px;bottom:16px;width:360px;z-index:6;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden;
  transform:translateX(calc(100% + 32px));transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.panel.on{transform:none}
.panel .scroll{overflow:auto;flex:1}
.status{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--rule)}
.status::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.status b{display:block;font-size:22px;font-weight:600;line-height:1.15}
.last{display:block;width:100%;text-align:left;padding:10px 16px;font-size:13px;color:var(--text);border-bottom:1px solid var(--rule)}
.last small{display:block;color:var(--text-2);font-size:12px}
.thin{margin:6px 0 0;font-size:12px;color:var(--text-2)}
.status b.long{font-size:17px;line-height:1.25}
.status small{display:block;margin-top:3px;font-size:12px;color:var(--text-2)}
.x{flex:none;width:40px;height:40px;margin:-6px -6px 0 0;display:grid;place-items:center;border-radius:2px;color:var(--text-2)}
.place{padding:12px 14px 10px 20px}
.place h2{font-size:15px;font-weight:600}
.place p{font-size:13px;color:var(--text-2)}
.shot{margin:0 14px 0 20px}
.shot img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:2px}
.shot figcaption{font-size:12px;color:var(--text-2);margin-top:6px}
.read{margin:14px 14px 0 20px;border-top:1px solid var(--rule)}
.read .kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.read .kv.joined{border-bottom:0;padding-bottom:2px}
.read dt{font-size:13px;color:var(--text-2)}
.read dd{font-size:15px;font-weight:500}
.scale{padding:8px 0 12px;border-bottom:1px solid var(--rule)}
.scale .bar{position:relative;height:8px;border-radius:1px;background:linear-gradient(90deg,var(--jaa),#f5a524 45%,var(--kuiva))}
.scale .mark{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px var(--surface)}
.scale .ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-2)}
.empty{margin:14px 14px 0 20px;padding:2px 0 2px 12px;border-left:2px solid var(--none);font-size:13px;color:var(--text-2)}
.empty strong{display:block;color:var(--text);font-weight:500;margin-bottom:2px}
.hist{margin:16px 14px 18px 20px}
.hist h3{font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.strip{display:flex;gap:1px}
.strip i{flex:1;height:14px}
.strip i.sel{outline:2px solid #fff;outline-offset:-1px}
.strip-t{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums}
.wpanel{margin:14px 14px 18px 20px;font-size:14px}
.wpanel p{margin-top:8px}
.wpanel .src{font-size:12px;color:var(--text-2);margin-top:12px}
.wpanel a{color:var(--text)}

.credits{border-top:1px solid var(--rule);padding:10px 16px 12px;font-size:12px;line-height:1.5;color:var(--text-2)}
.credits a{color:var(--text-2)}
.tabpanel{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.tabpanel::-webkit-scrollbar{width:6px}
.tabpanel::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.maplibregl-ctrl-attrib{display:none}
.maplibregl-ctrl-bottom-right{bottom:84px}
.maplibregl-ctrl-group{border-radius:2px!important;background:var(--surface)!important;border:1px solid var(--rule);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--rule)!important}
.maplibregl-ctrl-group button span{filter:invert(1)}
.maplibregl-popup-content{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;font:13px "Fira Sans",sans-serif;box-shadow:none}
.maplibregl-popup-tip{display:none}

@media (max-width:720px){
  .key{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));width:auto;max-height:52vh;max-height:52dvh}
  .fold{display:grid}
  .key.collapsed .tabpanel{display:none}
  .key.collapsed .tabs button[aria-selected="true"]{border-bottom-color:transparent}
  .rows{display:grid;grid-template-columns:1fr 1fr;padding:2px 0}
  .row{padding:8px 12px;min-height:40px}
  .row .share{display:none}
  .sec.explain{display:none}
  #warnsec h2,#warnsec .sub,#warnsec .warn,#warnsec>.note{display:none}
  #warnsec{padding-top:0}
  .warnsum{display:flex}
  .timeline{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px)}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72vh;max-height:72dvh;border-radius:8px 8px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .45s cubic-bezier(.32,.72,0,1);
    transform:translateY(105%);z-index:7}
  .panel.on{transform:none}
  .panel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 0}
  .panel .status{touch-action:none}  /* otsikkoalue on vetokahva: selain ei vieritä eikä päivitä sivua kesken vedon */
  .maplibregl-ctrl-bottom-right{display:none}
}
/* keskileveät näytöt (myös 200 % zoom): kortti ei jää aikajanan alle */
@media (min-width:721px) and (max-width:1000px){.key{max-height:calc(100dvh - 120px)}}
/* matalat näytöt: varoituslista tiivistyy riviksi, joka avaa listan sivupaneeliin */
@media (min-width:721px) and (max-height:899px){
  #warnsec h2,#warnsec .sub,#warnsec .warn,#warnsec>.note{display:none}
  #warnsec{padding:6px 16px}
  .warnsum{display:flex;padding:6px 0}
  #warnsec.open .warn{display:block}
  #warnsec.open{padding-bottom:10px}
}
.warnsum svg{transition:transform .2s}
.warn[aria-current="true"] b{color:var(--warn)}
#warnsec.open .warnsum svg{transform:rotate(90deg)}
/* painallus: palaute heti kun sormi osuu (toimii kaikilla syötteillä) */
.row,.item,.warn,.warnsum,.tabs button,.iconbtn,.x,.play,.lang button,.sugg button{transition:background-color .1s ease-out}
.row:active,.item:active,.warn:active,.warnsum:active,.tabs button:active,.sugg button:active{background:var(--surface-2)}
.iconbtn:active,.x:active,.play:active,.lang button:active{background:var(--rule)}
/* hover vain laitteille, joilla on oikea osoitin – kosketus jättäisi hoverin päälle */
@media (hover:hover) and (pointer:fine){
  .row:hover{background:var(--surface-2)}
  .item:hover{background:var(--surface-2)}
  .iconbtn:hover{color:var(--text);background:var(--surface-2)}
  .sugg button:hover{background:var(--rule)}
  .timeline .play:hover{background:var(--surface-2)}
  .x:hover{background:var(--surface-2);color:var(--text)}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label=""></div>

<section class="key loading" id="key">
  <header>
    <div class="brand"><svg class="mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="lens"><circle cx="12" cy="13" r="5.2"/></clipPath></defs><path d="M8.2 6 9.6 3.6h4.8L15.8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><rect x="1.8" y="6" width="20.4" height="14.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="13" r="5.2" fill="none" stroke="currentColor" stroke-width="1.7"/><g clip-path="url(#lens)" stroke-linecap="round"><path d="M9.3 18.5 11.3 8.2M14.7 18.5 12.7 8.2" stroke="currentColor" stroke-width="1.2"/><path d="M12 17.6v-1.8M12 14.3v-1.5M12 11.4v-1.2" stroke="var(--warn)" stroke-width="1.2"/></g><circle cx="18.6" cy="9" r="1" fill="var(--jaa)"/></svg><h1>Kelikamera</h1></div>
    <div style="display:flex;align-items:center;gap:8px"><time id="updated">–</time>
