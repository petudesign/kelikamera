<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelikamera · Suomen tiet nyt</title>
<meta name="description" content="Tien pinnan tila Fintrafficin kelikameroissa: mitattu tiesääasemilta, tekoälyarvio tulossa.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#121519; --surface-2:#181c22; --rule:#262b33;
  --text:#eef1f4; --text-2:#a3acb8; --focus:#ffd23f;
  --kuiva:#34c77b; --kostea:#8fc7ff; --marka:#2f7bf6; --luminen:#f2f4f8; --jaa:#ff4766; --none:#5b6573;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Fira Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#map{position:fixed;inset:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- selite ---------- */
.key{position:fixed;left:16px;top:16px;z-index:5;width:292px;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.key header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
.key h1{font-size:16px;font-weight:600;letter-spacing:-.005em}
.key time{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.rows{list-style:none;padding:4px 0}
.row{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:7px 14px 9px;text-align:left;position:relative}
.row:hover{background:var(--surface-2)}
.row .sw{width:10px;height:10px;border-radius:1px}
.row .lbl{font-size:14px}
.row .n{font-size:13px;color:var(--text-2)}
.row .share{position:absolute;left:38px;right:14px;bottom:4px;height:2px;background:var(--rule)}
.row .share i{display:block;height:100%;background:currentColor;opacity:.55}
.row[aria-pressed="false"] .lbl,.row[aria-pressed="false"] .n{opacity:.4;text-decoration:line-through}
.row[aria-pressed="false"] .sw{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--text-2)}
.key footer{border-top:1px solid var(--rule);padding:10px 14px 12px;font-size:12px;color:var(--text-2)}

/* ---------- tietopaneeli ---------- */
.panel{position:fixed;right:16px;top:16px;bottom:16px;width:360px;z-index:6;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden;
  transform:translateX(calc(100% + 32px));transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.panel.on{transform:none}
.panel .scroll{overflow:auto;flex:1}
.status{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--rule)}
.status::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.status b{display:block;font-size:22px;font-weight:600;line-height:1.15}
.status small{display:block;margin-top:3px;font-size:12px;color:var(--text-2)}
.x{flex:none;width:40px;height:40px;margin:-6px -6px 0 0;display:grid;place-items:center;border-radius:2px;color:var(--text-2)}
.x:hover{background:var(--surface-2);color:var(--text)}
.place{padding:12px 14px 10px 20px}
.place h2{font-size:15px;font-weight:600}
.place p{font-size:13px;color:var(--text-2)}
.shot{margin:0 14px 0 20px}
.shot img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:2px}
.shot figcaption{font-size:12px;color:var(--text-2);margin-top:6px}
.read{margin:14px 14px 0 20px;border-top:1px solid var(--rule)}
.read .kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.read .kv.joined{border-bottom:0;padding-bottom:2px}
.read dt{font-size:13px;color:var(--text-2)}
.read dd{font-size:15px;font-weight:500}
.scale{padding:8px 0 12px;border-bottom:1px solid var(--rule)}
.scale .bar{position:relative;height:8px;border-radius:1px;background:linear-gradient(90deg,var(--jaa),#f5a524 45%,var(--kuiva))}
.scale .mark{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px var(--surface)}
.scale .ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-2)}
.empty{margin:14px 14px 0 20px;padding:2px 0 2px 12px;border-left:2px solid var(--none);font-size:13px;color:var(--text-2)}
.empty strong{display:block;color:var(--text);font-weight:500;margin-bottom:2px}
.hist{margin:16px 14px 18px 20px}
.hist h3{font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.strip{display:flex;gap:2px}
.strip i{flex:1;height:14px}
.strip-t{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:4px;font-variant-numeric:tabular-nums}

.foot{position:fixed;left:16px;bottom:10px;z-index:4;font-size:11px;color:var(--text-2)}
.foot a{color:var(--text-2)}
.maplibregl-ctrl-attrib{display:none}
.maplibregl-ctrl-group{border-radius:2px!important;background:var(--surface)!important;border:1px solid var(--rule);box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--rule)!important}
.maplibregl-ctrl-group button span{filter:invert(1)}
.maplibregl-popup-content{background:var(--surface);color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:5px 8px;font:13px "Fira Sans",sans-serif;box-shadow:none}
.maplibregl-popup-tip{display:none}

@media (max-width:720px){
  .key{left:8px;right:8px;top:8px;width:auto}
  .key header{padding:10px 12px 8px}
  .rows{display:grid;grid-template-columns:1fr 1fr;padding:2px 0}
  .row{padding:8px 12px;min-height:40px}
  .row .share{display:none}
  .key footer{display:none}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72vh;border-radius:8px 8px 0 0;border-bottom:0;
    transform:translateY(105%)}
  .panel.on{transform:none}
  .panel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 0}
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Kelikamerakartta"></div>

<section class="key" aria-label="Selite ja suodatus">
  <header><h1>Kelikamera</h1><time id="updated">–</time></header>
  <ul class="rows" id="rows"></ul>
  <footer>Mitattu = tiesääaseman kelianturi alle 5 km päässä kamerasta. Harmaisiin pisteisiin tulee tekoälyn arvio kuvasta.</footer>
</section>

<aside class="panel" id="panel" aria-live="polite" aria-label="Kameran tiedot"></aside>

<div class="foot">Data: <a href="https://www.digitraffic.fi/" target="_blank" rel="noopener">Fintraffic / digitraffic.fi</a>, CC BY 4.0 · Kartta: © <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © OpenMapTiles © OpenStreetMap · Rajat: Natural Earth</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const css=getComputedStyle(document.documentElement), v=n=>css.getPropertyValue(n).trim();
const COLORS={"kuiva":v("--kuiva"),"kostea":v("--kostea"),"märkä":v("--marka"),"luminen":v("--luminen"),"jää/kuura":v("--jaa"),"ei mittausta":v("--none")};
const LABEL={"kuiva":"Kuiva","kostea":"Kostea","märkä":"Märkä","luminen":"Luminen / sohjo","jää/kuura":"Jää / kuura","ei mittausta":"Ei mittausta"};
const ORDER=["jää/kuura","luminen","märkä","kostea","kuiva","ei mittausta"];
const hidden=new Set();
let DATA, byId={};

const fmtTime=s=>new Date(s).toLocaleString("fi-FI",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtClock=s=>new Date(s).toLocaleTimeString("fi-FI",{hour:"2-digit",minute:"2-digit"});
const num=(x,u="",d=1)=>x==null?"–":`${x.toLocaleString("fi-FI",{minimumFractionDigits:d,maximumFractionDigits:d})}${u}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const X='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6"/></svg>';

// Kartta rajataan Suomeen näytön muodon mukaan: koko Suomi mahtuu aina näkyviin,
// mutta kauemmas ei voi loitontaa eikä karttaa voi vetää naapurimaihin.
const FINLAND=[[19.0,59.6],[31.7,70.1]];
function fitPadding(){
  const mobile=innerWidth<=720, key=document.querySelector(".key");
  return mobile?{top:key.offsetHeight+20,bottom:16,left:12,right:12}:{top:24,bottom:32,left:24,right:24};
}
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/dark",
  bounds:FINLAND,fitBoundsOptions:{padding:fitPadding()},maxZoom:14,attributionControl:false});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
function lockToFinland(){
  map.setMaxBounds(null); map.setMinZoom(0);
  map.fitBounds(FINLAND,{padding:fitPadding(),animate:false});
  const b=map.getBounds(), dx=(b.getEast()-b.getWest())*.15, dy=(b.getNorth()-b.getSouth())*.1;
  map.setMinZoom(map.getZoom()-.2);
  map.setMaxBounds([[b.getWest()-dx,b.getSouth()-dy],[b.getEast()+dx,b.getNorth()+dy]]);
}
map.once("load",lockToFinland);
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(lockToFinland,150)});

fetch("data/latest.json").then(r=>r.json()).then(d=>{
  DATA=d; d.cameras.forEach(c=>byId[c.id]=c);
  const u=document.getElementById("updated"); u.textContent=fmtTime(d.run); u.dateTime=d.run;
  buildKey();
  map.loaded()?addLayer():map.on("load",addLayer);
});

function buildKey(){
  const total=DATA.cameras.length;
  const el=document.getElementById("rows");
  el.innerHTML=ORDER.map(k=>{const n=DATA.counts[k]??0;return `<li><button class="row" aria-pressed="true" data-k="${k}" style="color:${COLORS[k]}">
    <span class="sw" style="background:${COLORS[k]}"></span><span class="lbl" style="color:var(--text)">${LABEL[k]}</span>
    <span class="n num">${n}</span><span class="share" aria-hidden="true"><i style="width:${(n/total*100).toFixed(1)}%"></i></span></button></li>`}).join("");
  el.querySelectorAll(".row").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; hidden.has(k)?hidden.delete(k):hidden.add(k);
    b.setAttribute("aria-pressed",String(!hidden.has(k))); applyFilter();
  });
}

function geojson(){
  return {type:"FeatureCollection",features:DATA.cameras.map(c=>({type:"Feature",
    geometry:{type:"Point",coordinates:[c.lon,c.lat]},
    properties:{id:c.id,k:c.cls||"ei mittausta",name:c.name,rank:ORDER.length-ORDER.indexOf(c.cls||"ei mittausta")}}))};
}

function addLayer(){
  // Suomen ulkopuoli himmennetään (Natural Earth 1:50m, public domain). Lähellä raja on karkea,
  // joten himmennys häivytetään pois, kun zoomataan sisään.
  map.addSource("fin",{type:"geojson",data:"data/finland.geojson"});
  map.addLayer({id:"outside",type:"fill",source:"fin",filter:["==",["get","role"],"mask"],
    paint:{"fill-color":"#0b0d10","fill-opacity":["interpolate",["linear"],["zoom"],5,.72,7,.5,9,0]}});
  map.addLayer({id:"border",type:"line",source:"fin",filter:["==",["get","role"],"border"],
    paint:{"line-color":"#9fb0c4","line-opacity":["interpolate",["linear"],["zoom"],5,.35,9,0],"line-width":1}});
  map.addSource("cams",{type:"geojson",data:geojson()});
  map.addLayer({id:"cams-halo",type:"circle",source:"cams",filter:["==",["get","k"],"jää/kuura"],
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],4,9,10,18],"circle-color":COLORS["jää/kuura"],"circle-opacity":.22,"circle-blur":.6}});
  map.addLayer({id:"cams",type:"circle",source:"cams",layout:{"circle-sort-key":["get","rank"]},
    paint:{
      "circle-radius":["interpolate",["linear"],["zoom"],4,["case",["==",["get","k"],"ei mittausta"],2.2,3.6],10,["case",["==",["get","k"],"ei mittausta"],5,8]],
      "circle-color":["match",["get","k"],...Object.entries(COLORS).flat(),"#888"],
      "circle-stroke-width":["case",["==",["get","k"],"ei mittausta"],0,1],
      "circle-stroke-color":"#0b0d10"}});
  map.addLayer({id:"cams-sel",type:"circle",source:"cams",filter:["==",["get","id"],""],
    paint:{"circle-radius":12,"circle-color":"transparent","circle-stroke-width":2,"circle-stroke-color":"#fff"}});

  const tip=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:10});
  map.on("mouseenter","cams",e=>{map.getCanvas().style.cursor="pointer";const p=e.features[0].properties;
    tip.setLngLat(e.lngLat).setHTML(`${esc(p.name)} · ${LABEL[p.k]}`).addTo(map)});
  map.on("mouseleave","cams",()=>{map.getCanvas().style.cursor="";tip.remove()});
  map.on("click","cams",e=>open(e.features[0].properties.id));
  map.on("click",e=>{if(!map.queryRenderedFeatures(e.point,{layers:["cams"]}).length)close()});
  applyFilter();
}
const select=id=>{if(map.getLayer("cams-sel"))map.setFilter("cams-sel",["==",["get","id"],id])};

function applyFilter(){
  if(!map.getLayer("cams")) return; // tasot eivät vielä valmiina; addLayer kutsuu tätä lopuksi
  map.setFilter("cams",hidden.size?["!",["in",["get","k"],["literal",[...hidden]]]]:null);
  map.setFilter("cams-halo",hidden.has("jää/kuura")?["==",["get","k"],"__none"]:["==",["get","k"],"jää/kuura"]);
}

function scale(fr){
  const MAX=0.82; // kuivan tien tyypillinen kitka anturilla
  return `<div class="scale" aria-hidden="true"><div class="bar">
    ${fr!=null?`<i class="mark" style="left:${Math.max(0,Math.min(fr,MAX))/MAX*100}%"></i>`:""}</div>
    <div class="ends"><span>Liukas · jää ~0,1</span><span>Pitävä · kuiva 0,82</span></div></div>`;
}

function open(id){
  const c=byId[id]; if(!c) return;
  select(id);
  const k=c.cls||"ei mittausta", col=COLORS[k], hist=c.hist||[];
  const p=document.getElementById("panel");
  p.innerHTML=`<div class="scroll">
    <div class="status" style="--c:${col}">
      <div><b>${LABEL[k]}</b><small>${c.cls?`Mitattu <span class="num">${fmtClock(c.t)}</span> · asema ${c.st} · <span class="num">${num(c.km," km")}</span>`:"Tekoälyarvio tulossa"}</small></div>
      <button class="x" aria-label="Sulje" onclick="close()">${X}</button>
    </div>
    <div class="place"><h2>${esc(c.name)}</h2><p>${c.road?"Tie "+c.road+" · ":""}${esc(c.mun||"")}</p></div>
    <figure class="shot"><img src="${c.img}?t=${Date.now()}" alt="Kelikamerakuva, ${esc(c.name)}">
      <figcaption>Kamerakuva nyt · Fintraffic${c.view?" · "+esc(c.view):""}</figcaption></figure>
    ${c.cls?`<dl class="read">
        <div class="kv joined"><dt>Kitka µ</dt><dd class="num">${num(c.friction,"",2)}</dd></div>
        ${scale(c.friction)}
        <div class="kv"><dt>Tien lämpötila</dt><dd class="num">${num(c.roadT," °C")}</dd></div>
        <div class="kv"><dt>Ilman lämpötila</dt><dd class="num">${num(c.airT," °C")}</dd></div>
        <div class="kv"><dt>Vesi</dt><dd class="num">${num(c.water," mm",2)}</dd></div>
        <div class="kv"><dt>Lumi</dt><dd class="num">${num(c.snow," mm",2)}</dd></div>
        <div class="kv"><dt>Jää</dt><dd class="num">${num(c.ice," mm",2)}</dd></div>
      </dl>`
    :`<p class="empty"><strong>Ei mitattua keliä</strong>${c.why==="asema yli 5 km päässä"
        ?`Lähin tiesääasema on ${num(c.km," km")} päässä, eikä sen mittaus kerro tämän kameran kelistä.`
        :"Lähimmällä tiesääasemalla ei ole tienpinnan kelianturia."} Tähän tulee tekoälyn arvio kamerakuvasta.</p>`}
    ${hist.length>1?`<div class="hist"><h3>Viimeiset ${hist.length} mittausta</h3>
      <div class="strip">${hist.map(h=>`<i title="${fmtTime(h.t)}: ${LABEL[h.c||"ei mittausta"]}" style="background:${COLORS[h.c||"ei mittausta"]}"></i>`).join("")}</div>
      <div class="strip-t"><span>${fmtTime(hist[0].t)}</span><span>${fmtTime(hist.at(-1).t)}</span></div></div>`:""}
  </div>`;
  p.classList.add("on");
}
function close(){document.getElementById("panel").classList.remove("on");select("")}
addEventListener("keydown",e=>{if(e.key==="Escape")close()});
</script>
</body>
</html>
